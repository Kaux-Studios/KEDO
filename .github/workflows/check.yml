name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dotnet:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build Kedo.sln --no-restore -c Release
      - run: dotnet test tests/Kedo.Tests/Kedo.Tests.csproj --no-build -c Release
