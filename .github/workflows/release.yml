name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Derive version from tag
        run: echo "KEDO_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore --locked-mode
      - run: dotnet build Kedo.sln --no-restore -c Release -p:Version=${KEDO_VERSION}
      - run: dotnet test tests/Kedo.Tests/Kedo.Tests.csproj --no-build -c Release
      - name: Pack (package validation runs here)
        run: |
          dotnet pack src/Kedo.Core/Kedo.Core.csproj --no-build -c Release -p:Version=${KEDO_VERSION} -o out
          dotnet pack src/Kedo.Compiler/Kedo.Compiler.csproj --no-build -c Release -p:Version=${KEDO_VERSION} -o out
          dotnet pack src/Kedo.Cli/Kedo.Cli.csproj --no-build -c Release -p:Version=${KEDO_VERSION} -o out
      - name: Push to GitHub Packages (private feed of Kaux-Studios)
        run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/Kaux-Studios/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.nupkg
          generate_release_notes: true
